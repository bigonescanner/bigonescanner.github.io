<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big One Scanner - Dashboard Interattiva</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Palette Colori Dinamici */
      --color-low: #10b981;
      --color-mod: #f59e0b;
      --color-high: #f97316;
      --color-vhigh: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .brand-group h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-group h1 span {
      font-weight: 300;
      color: var(--text-muted);
    }

    .nav-links {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .quote-box {
      max-width: 220px;
      text-align: right;
      font-size: 12px;
      font-style: italic;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      align-items: flex-end;
      gap: 10px;
      margin-top: -20px;
    }

    .col-animal {
      text-align: center;
    }

    .col-animal img {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: contain;
    }

    .col-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      padding-bottom: 20px;
    }

    .col-center img {
      max-height: 220px;
      margin-bottom: 10px;
    }

    .sentiment-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
    }

    .sentiment-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 2px;
      margin-bottom: 15px;
    }

    .counter {
      font-size: 54px;
      font-weight: 800;
      margin-bottom: 20px;
      transition: color 0.3s ease;
    }

    .gauge-wrapper {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .gauge-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      margin-bottom: 8px;
    }

    .label-bull { color: #10b981; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
    .label-bear { color: #ef4444; font-weight: 700; font-size: 12px; letter-spacing: 1px; }

    .gauge-bar {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 50%, #ef4444 100%);
      position: relative;
    }

    .gauge-pointer {
      position: absolute;
      top: 50%;
      left: 52%; 
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: #334155;
      border: 4px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: left 0.2s ease-out;
    }

    .gauge-center-tick {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .horizon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 10px;
    }

    .card-time {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .time-title {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .time-value {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .time-status {
      font-size: 11px;
      font-weight: 600;
    }

    /* Area di Controllo Interattiva */
    .simulator-control {
      margin-top: 30px;
      padding: 15px;
      background: var(--bg-main);
      border: 1px dashed var(--border-color);
      border-radius: 14px;
      text-align: center;
    }

    .simulator-control label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 8px;
    }

    .simulator-control input[type="range"] {
      width: 100%;
      max-width: 400px;
      accent-color: #334155;
      cursor: pointer;
    }

    footer {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .arena { grid-template-columns: 1fr; gap: 30px; }
      .col-center { grid-row: 1; }
      header { flex-direction: column; gap: 15px; }
      .quote-box { text-align: left; }
      .horizon-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header>
      <div class="brand-group">
        <h1>📈 BIG ONE <span>SCANNER</span></h1>
        <div class="nav-links">Sentiment &nbsp;|&nbsp; Analisi &nbsp;|&nbsp; Opportunità</div>
      </div>
      <div class="quote-box">
        "Non è una questione di prevedere il futuro, ma di prepararsi al peggio."
      </div>
    </header>

    <div class="arena">
      <div class="col-animal">
        <img src="https://placeholder.com" alt="Bull">
      </div>

      <div class="col-center">
        <img src="https://placeholder.com" alt="Black Swan">
        <div class="sentiment-title">Market Sentiment</div>
        <div class="sentiment-subtitle">Big One Risk</div>
        <!-- ID per l'aggiornamento JavaScript -->
        <div class="counter" id="main-counter">52%</div>
      </div>

      <div class="col-animal">
        <img src="https://placeholder.com" alt="Bear">
      </div>
    </div>

    <div class="gauge-wrapper">
      <div class="gauge-labels">
        <span class="label-bull">🐂 BULL</span>
        <span class="label-bear">BEAR 🐻</span>
      </div>
      <div class="gauge-bar">
        <!-- ID per spostare il puntatore -->
        <div class="gauge-pointer" id="gauge-pointer"></div>
      </div>
      <div class="gauge-center-tick">| <br> Neutrale</div>
    </div>

    <!-- Griglia degli Orizzonti Temporali Dinamici -->
    <div class="horizon-grid">
      <div class="card-time" id="card-0h">
        <div class="time-title">🕒 0h</div>
        <div class="time-value" id="val-0h">--</div>
        <div class="time-status" id="status-0h">--</div>
      </div>
      
      <div class="card-time" id="card-12h">
        <div class="time-title">🕒 12h</div>
        <div class="time-value" id="val-12h">--</div>
        <div class="time-status" id="status-12h">--</div>
      </div>

      <div class="card-time" id="card-24h">
        <div class="time-title">🕒 24h</div>
        <div class="time-value" id="val-24h">--</div>
        <div class="time-status" id="status-24h">--</div>
      </div>

      <div class="card-time" id="card-48h">
        <div class="time-title">🕒 48h</div>
        <div class="time-value" id="val-48h">--</div>
        <div class="time-status" id="status-48h">--</div>
      </div>
    </div>

    <!-- Pannello Slider per simulare il funzionamento -->
    <div class="simulator-control">
      <label for="risk-slider">🧪 Simulatore di Rischio Live (Trascina per testare l'interfaccia)</label>
      <input type="range" id="risk-slider" min="0" max="100" value="52">
    </div>

    <footer>
      <span>Informazione</span>
      <span>•</span>
      <span>Consapevolezza</span>
      <span>•</span>
      <span>Decisioni Migliori</span>
    </footer>

  </div>

  <!-- LOGICA JAVASCRIPT PER RENDERE TUTTO DINAMICO -->
  <script>
    const slider = document.getElementById('risk-slider');
    const mainCounter = document.getElementById('main-counter');
    const pointer = document.getElementById('gauge-pointer');

    // Configurazione dei profili di rischio per soglia percentuale
    const getStatusDetails = (percentage) => {
      if (percentage < 30) return { text: 'Rischio Basso', color: 'var(--color-low)' };
      if (percentage < 60) return { text: 'Rischio Moderato', color: 'var(--color-mod)' };
      if (percentage < 80) return { text: 'Rischio Alto', color: 'var(--color-high)' };
      return { text: 'Rischio Molto Alto', color: 'var(--color-vhigh)' };
    };

    // Funzione per mantenere i valori dei calcoli tra 0 e 100
    const clamp = (val) => Math.min(Math.max(Math.round(val), 0), 100);

    function updateDashboard() {
      const currentRisk = parseInt(slider.value);

      // 1. Aggiorna contatore centrale e posizione della lancetta
      mainCounter.textContent = `${currentRisk}%`;
